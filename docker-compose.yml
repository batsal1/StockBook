services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stockbook
      POSTGRES_PASSWORD: stockbook
      POSTGRES_DB: stockbook
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockbook"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://stockbook:stockbook@db:5432/stockbook
      UPLOAD_DIR: /data/uploads
    ports: ["3000:3000"]
    volumes: [uploads:/data/uploads]
volumes:
  pgdata:
  uploads:
