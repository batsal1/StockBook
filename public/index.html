<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockbook — Business Management</title>
<style>

:root{
  --bg:#f4f6f8;--panel:#fff;--ink:#17201d;--muted:#66736e;--line:#dfe5e2;
  --primary:#13201c;--accent:#a3172b;--green:#17633f;--amber:#8a6200;--blue:#245b8f;
  --red:#a3172b;--shadow:0 8px 24px rgba(20,32,28,.07);--radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:var(--primary);color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}
.brand{font-size:20px;font-weight:800;padding:8px 10px 20px}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.65;margin-top:3px}
.nav-group{margin:18px 0 7px 10px;color:#91a09a;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.nav button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;color:#dce5e1;text-align:left;padding:10px;border-radius:9px;margin:2px 0}
.nav button:hover,.nav button.active{background:#2a3833;color:#fff}
.nav .icon{width:20px;text-align:center}
.main{margin-left:245px;width:calc(100% - 245px)}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:10}
.search{flex:1;max-width:500px}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#f8faf9}
.top-actions{display:flex;gap:8px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:#e9eeeb;display:grid;place-items:center;font-weight:700}
.content{padding:26px;max-width:1500px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.page-head h1{margin:0;font-size:26px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:650}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn:hover{filter:brightness(.97)}
.select,.input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;color:var(--ink)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(170px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.kpi{min-height:126px}
.kpi .label{color:var(--muted);font-size:12px}
.kpi .value{font-size:25px;font-weight:800;margin:7px 0}
.change{font-size:12px}
.up{color:var(--green)}.down{color:var(--red)}.warn{color:var(--amber)}
.two{grid-template-columns:1.45fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.chart-card{min-height:310px}
.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-title h2{font-size:16px;margin:0}.muted{color:var(--muted)}
.chart{height:220px;position:relative}
.chart svg{width:100%;height:100%;overflow:visible}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:5px}
.bar-list{display:grid;gap:13px;margin-top:8px}
.bar-row{display:grid;grid-template-columns:120px 1fr 70px;gap:9px;align-items:center;font-size:12px}
.bar-track{height:9px;background:#edf1ef;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--primary)}
.donut-wrap{display:flex;align-items:center;gap:25px;height:220px}
.donut{width:155px;height:155px;border-radius:50%;background:conic-gradient(#17633f 0 72%,#8a6200 72% 90%,#a3172b 90% 96%,#73817c 96% 100%);position:relative}
.donut:after{content:"";position:absolute;inset:35px;background:#fff;border-radius:50%}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px;z-index:1}
.legend-list{display:grid;gap:8px;font-size:12px}.legend-list span{display:flex;justify-content:space-between;gap:20px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid #eef1ef;white-space:nowrap}
td.right,th.right{text-align:right}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}
.badge.green{background:#e6f2eb;color:var(--green)}.badge.amber{background:#fff4d7;color:var(--amber)}.badge.red{background:#fbe7eb;color:var(--red)}.badge.blue{background:#e8f0f8;color:var(--blue)}
.section{display:none}.section.active{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .input{min-width:180px}
.notice{padding:12px 14px;border-radius:10px;background:#fff8e5;border:1px solid #f0dfae;color:#6d5000;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:80px}
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.mini{background:#f7f9f8;padding:12px;border-radius:10px}.mini b{display:block;font-size:18px;margin-top:3px}
.report-grid{grid-template-columns:repeat(3,1fr)}
.report{padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.report h3{margin:0 0 5px;font-size:14px}.report p{margin:0;color:var(--muted);font-size:12px}
.empty{padding:50px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:16px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:22px}
.close{float:right;border:0;background:transparent;font-size:24px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.three,.report-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{width:68px;padding:14px 8px}.brand{font-size:0}.brand:before{content:"S";font-size:22px}.brand small,.nav-group,.nav button span:not(.icon){display:none}.nav button{justify-content:center}.main{margin-left:68px;width:calc(100% - 68px)}.topbar{padding:0 14px}.content{padding:16px}.kpis,.stat-row{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.page-head{flex-direction:column}}
/* ---- additions for the live app ---- */
.badge.grey{background:#eef1ef;color:var(--muted)}
.right{text-align:right}
.kpi .value.small{font-size:20px}
.clickable{cursor:pointer}.clickable:hover td{background:#f7f9f8}
.top-search{position:relative;flex:1;max-width:500px}
.top-search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#f8faf9}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;max-height:420px;overflow:auto;padding:6px}
.dropdown .grp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 4px}
.dropdown button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px}
.dropdown button:hover{background:#f2f5f3}
.bell{position:relative}
.bell .count{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:800}
.panel{position:absolute;top:60px;right:70px;width:340px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:25;padding:8px}
.panel a{display:flex;justify-content:space-between;gap:10px;padding:10px;border-radius:8px;color:var(--ink);text-decoration:none}
.panel a:hover{background:#f2f5f3}
.avatar{cursor:pointer;border:0}
.loading{padding:40px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.bar-fill.red{background:var(--accent)}.bar-fill.green{background:var(--green)}.bar-fill.amber{background:var(--amber)}
.bar-row.dual .bar-track{height:7px}
.dual-tracks{display:grid;gap:3px}
.modal-box.wide{width:min(1050px,100%)}
.modal-box h2{margin:0 0 4px}
.line-table td{padding:6px 6px}.line-table input{width:100%;min-width:60px;border:1px solid var(--line);border-radius:6px;padding:6px 7px}
.sugg{border:1px solid var(--line);border-radius:10px;margin-top:6px;max-height:220px;overflow:auto}
.sugg button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid #eef1ef;background:#fff;padding:9px 11px;text-align:left}
.sugg button:hover{background:#f5f8f6}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 24px;max-width:340px;margin-left:auto;margin-top:12px}
.totals .grand{font-size:20px;font-weight:800}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.login-wrap{position:fixed;inset:0;background:var(--primary);display:grid;place-items:center;z-index:60;padding:20px}
.login-card{background:#fff;border-radius:18px;padding:30px;width:min(420px,100%)}
.login-card h1{margin:0 0 4px;font-size:26px}
.login-card .field{margin-top:12px}
.login-card .input{width:100%}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#f2f5f3;border-radius:999px;padding:6px 12px;font-size:12px}
.chip b{margin-left:4px}
/* bill scanner */
.drop{border:2px dashed #c4cdc9;border-radius:14px;padding:30px;text-align:center;background:#fafcfb;transition:background .15s}
.drop.over{background:#eef5f1;border-color:var(--green)}
.drop h3{margin:0 0 6px}
.engine{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0 4px}
.engine label{border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;background:#fff;text-align:left;max-width:280px}
.engine label.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.engine label.off{opacity:.55;cursor:not-allowed}
.engine small{display:block;color:var(--muted);font-size:11px}
.progress{height:8px;background:#edf1ef;border-radius:99px;overflow:hidden;margin-top:10px}
.progress div{height:100%;background:var(--green);width:0;transition:width .2s}
.scan-grid{display:grid;grid-template-columns:minmax(300px,0.9fr) 1.4fr;gap:14px;align-items:start}
.scan-img{background:#eef1ef;border-radius:10px;overflow:auto;max-height:78vh}
.scan-img img{width:100%;display:block}
.scan-img iframe{width:100%;height:75vh;border:0}
.warn-list{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.warn-list li{background:#fff8e5;border:1px solid #f0dfae;color:#6d5000;border-radius:8px;padding:7px 10px;font-size:12.5px}
.ok-list li{background:#e6f2eb;border-color:#bcdcc8;color:var(--green)}
.match{font-size:11.5px}
.match select{max-width:190px;font-size:12px;padding:5px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
pre.raw{white-space:pre-wrap;font-size:11.5px;background:#f7f9f8;border-radius:8px;padding:10px;max-height:220px;overflow:auto}
@media(max-width:1100px){.scan-grid{grid-template-columns:1fr}}
@media print{.sidebar,.topbar,.modal-actions,.close,.no-print{display:none!important}.main{margin:0;width:100%}.modal{position:static;background:none;padding:0}.modal-box{max-height:none;box-shadow:none}.app>main>.content{display:none}}
</style>
</head>
<body>
<div class="login-wrap" id="login" style="display:none">
  <form class="login-card" id="loginForm">
    <h1>Stockbook</h1><p class="muted" style="margin:0">Sign in to your shop</p>
    <div class="field"><label>Email</label><input class="input" name="email" type="email" value="owner@demo.shop" required autocomplete="username"></div>
    <div class="field"><label>Password</label><input class="input" name="password" type="password" value="demo1234" required autocomplete="current-password"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn red" style="width:100%;margin-top:6px">Sign in</button>
    <p class="muted" style="font-size:12px;margin-bottom:0">Demo shop: owner@demo.shop / demo1234 (after <code>npm run db:seed</code>)</p>
  </form>
</div>

<div class="app">
<aside class="sidebar">
  <div class="brand"><span id="brandName">Stockbook</span> <small>Business Management</small></div>
  <div class="nav">
    <div class="nav-group">Overview</div>
    <button data-section="dashboard"><span class="icon">⌂</span><span>Dashboard</span></button>
    <div class="nav-group">Operations</div>
    <button data-section="sales"><span class="icon">▣</span><span>Sales</span></button>
    <button data-section="purchases"><span class="icon">⇩</span><span>Purchases</span></button>
    <button data-section="scanner"><span class="icon">⧉</span><span>Bill Scanner</span></button>
    <button data-section="inventory"><span class="icon">▤</span><span>Inventory</span></button>
    <button data-section="parties"><span class="icon">♙</span><span>Customers & Suppliers</span></button>
    <div class="nav-group">Finance</div>
    <button data-section="finance"><span class="icon">₹</span><span>Finance</span></button>
    <button data-section="expenses"><span class="icon">−</span><span>Expenses</span></button>
    <button data-section="tax"><span class="icon">%</span><span>GST / Tax</span></button>
    <div class="nav-group">Insights</div>
    <button data-section="reports"><span class="icon">▥</span><span>Reports</span></button>
    <button data-section="analytics"><span class="icon">◒</span><span>Analytics</span></button>
    <div class="nav-group">System</div>
    <button data-section="settings"><span class="icon">⚙</span><span>Settings</span></button>
  </div>
</aside>
<main class="main">
<header class="topbar">
  <div class="top-search"><input placeholder="Search products, invoices, customers..." id="globalSearch" autocomplete="off" aria-label="Search"><div class="dropdown" id="searchResults" hidden></div></div>
  <select class="select" id="periodSel" aria-label="Period">
    <option value="last30">Last 30 days</option><option value="month">This month</option><option value="lastmonth">Last month</option>
    <option value="quarter">This quarter</option><option value="fy">This financial year</option>
  </select>
  <button class="btn bell" id="bellBtn" aria-label="Alerts">🔔<span class="count" id="bellCount" hidden></span></button>
  <button class="avatar" id="avatar" title="Account">OW</button>
</header>
<div class="panel" id="alertPanel" hidden></div>
<div class="panel" id="accountPanel" hidden style="right:20px;width:240px"></div>
<div class="content">
  <section id="dashboard" class="section"></section>
  <section id="sales" class="section"></section>
  <section id="purchases" class="section"></section>
  <section id="scanner" class="section"></section>
  <section id="inventory" class="section"></section>
  <section id="parties" class="section"></section>
  <section id="finance" class="section"></section>
  <section id="expenses" class="section"></section>
  <section id="tax" class="section"></section>
  <section id="reports" class="section"></section>
  <section id="analytics" class="section"></section>
  <section id="settings" class="section"></section>
</div>
</main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-box" id="mbox"></div></div>
<div id="toast" role="status" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#13201c;color:#fff;padding:11px 18px;border-radius:9px;display:none;z-index:80;font-weight:650;max-width:90vw"></div>
<input type="file" id="filePick" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ================= core ================= */
const API = location.protocol.startsWith('http') ? location.origin : 'http://localhost:3000';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let token = localStorage.getItem('sb.token') || '';
let ME = null;
const isBoss = () => ME && ME.role !== 'cashier';

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.style.background = bad ? '#a3172b' : '#13201c'; t.style.display = 'block';
  clearTimeout(window._tt); window._tt = setTimeout(() => (t.style.display = 'none'), bad ? 6000 : 2800);
}
async function api(method, path, body, opts = {}) {
  let res;
  const headers = { ...(token ? { Authorization: 'Bearer ' + token } : {}) };
  if (body && !opts.form) headers['Content-Type'] = 'application/json';
  try { res = await fetch(API + path, { method, headers, body: opts.form ? body : body ? JSON.stringify(body) : undefined }); }
  catch (e) { toast('Cannot reach the server. Is "npm run dev" running?', true); throw e; }
  if (res.status === 401 && !path.startsWith('/auth/login')) { showLogin(); throw new Error('Signed out'); }
  if (opts.blob && res.ok) return res.blob();
  const data = (res.headers.get('content-type') || '').includes('json') ? await res.json() : await res.text();
  if (!res.ok) { const e = new Error((data && data.message) || 'Error ' + res.status); e.status = res.status; if (!opts.quiet) toast(e.message, true); throw e; }
  return data;
}
const GET = (p, o) => api('GET', p, null, o);

/* ---------- formatting ---------- */
const rupees = (p) => (p || 0) / 100;
const inr = (p, dec) => (p < 0 ? '−' : '') + '₹' + Math.abs(rupees(p)).toLocaleString('en-IN', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 });
const inr2 = (p) => inr(p, true);
const short = (p) => {
  const r = rupees(p), a = Math.abs(r), s = r < 0 ? '−' : '';
  if (a >= 1e7) return s + '₹' + (a / 1e7).toFixed(2) + 'Cr';
  if (a >= 1e5) return s + '₹' + (a / 1e5).toFixed(1) + 'L';
  if (a >= 1e3) return s + '₹' + (a / 1e3).toFixed(1) + 'k';
  return s + '₹' + Math.round(a);
};
const dshort = (d) => (d ? new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) : '—');
const dlong = (d) => (d ? new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—');
const qty = (n) => (Math.round(n * 1000) / 1000).toLocaleString('en-IN');
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, k) => new Date(Date.parse(d + 'T00:00:00Z') + k * 864e5).toISOString().slice(0, 10);
function change(pct, label = 'vs previous period') {
  if (pct == null || !isFinite(pct)) return `<div class="change muted">No earlier data to compare</div>`;
  return `<div class="change ${pct >= 0 ? 'up' : 'down'}">${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct)}% ${label}</div>`;
}
const PAY = { cash: 'Cash', upi: 'UPI', card: 'Card', bank: 'Bank', credit: 'Credit' };
const TYPE = { sale: 'Sale', purchase: 'Purchase', sale_return: 'Sale return', purchase_return: 'Purchase return' };
function payStatus(inv) {
  if (inv.status === 'cancelled') return '<span class="badge grey">Cancelled</span>';
  const due = inv.totalPaise - inv.paidPaise;
  if (due <= 0) return '<span class="badge green">Paid</span>';
  if (inv.dueDate && inv.dueDate < today()) return '<span class="badge red">Overdue</span>';
  if (inv.paidPaise > 0) return '<span class="badge blue">Partial</span>';
  return `<span class="badge amber">${inv.type === 'purchase' ? 'Due' : 'Unpaid'}</span>`;
}
function stockBadge(p) {
  if (p.stock <= 0) return '<span class="badge red">Out</span>';
  if (p.stock <= p.reorderLevel) return '<span class="badge amber">Low</span>';
  if (p.nextExpiry && p.nextExpiry <= addDays(today(), (ME?.shop?.expiryWarnDays) || 30)) return '<span class="badge red">Expiring</span>';
  return '<span class="badge green">Healthy</span>';
}
const roleNote = '<div class="notice">Your role can\'t see financial figures. Ask the owner for manager access.</div>';

/* ---------- period ---------- */
function periodRange(key = $('#periodSel').value) {
  const t = today(), d = new Date(t + 'T00:00:00Z'), y = d.getUTCFullYear(), m = d.getUTCMonth();
  const iso = (dt) => dt.toISOString().slice(0, 10);
  const fyStartYear = m >= 3 ? y : y - 1;
  switch (key) {
    case 'month': return { from: t.slice(0, 8) + '01', to: t, label: d.toLocaleDateString('en-IN', { month: 'long', year: 'numeric', timeZone: 'UTC' }) };
    case 'lastmonth': { const s = new Date(Date.UTC(y, m - 1, 1)), e = new Date(Date.UTC(y, m, 0)); return { from: iso(s), to: iso(e), label: s.toLocaleDateString('en-IN', { month: 'long', year: 'numeric', timeZone: 'UTC' }) }; }
    case 'quarter': { const q = Math.floor(((m + 9) % 12) / 3); const sm = (q * 3 + 3) % 12; const sy = sm > m ? y - 1 : y; return { from: iso(new Date(Date.UTC(sy, sm, 1))), to: t, label: `Q${q + 1} FY ${fyStartYear}-${String(fyStartYear + 1).slice(2)}` }; }
    case 'fy': return { from: `${fyStartYear}-04-01`, to: t, label: `FY ${fyStartYear}-${String(fyStartYear + 1).slice(2)}` };
    default: return { from: addDays(t, -29), to: t, label: 'the last 30 days' };
  }
}
const pq = () => { const p = periodRange(); return `from=${p.from}&to=${p.to}`; };

/* ---------- charts ---------- */
function lineChart(series, labels, opts = {}) {
  const W = 700, H = 230, L = 46, R = 690, T = 20, B = 200;
  const vals = series.flatMap((s) => s.values);
  let max = Math.max(...vals, 0), min = Math.min(...vals, 0);
  if (max === min) max = min + 1;
  const pad = (max - min) * 0.08; max += pad; if (min < 0) min -= pad;
  const n = Math.max(1, (series[0]?.values.length || 1) - 1);
  const x = (i) => L + ((R - L) * i) / n, y = (v) => B - ((B - T) * (v - min)) / (max - min);
  const ticks = [0, 1, 2, 3, 4].map((k) => min + ((max - min) * k) / 4);
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(opts.title || 'chart')}"><g stroke="#e8ecea">`;
  ticks.forEach((t) => (svg += `<line x1="${L}" y1="${y(t)}" x2="${R}" y2="${y(t)}"/>`));
  svg += `</g><g fill="#66736e" font-size="10">`;
  ticks.forEach((t) => (svg += `<text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${short(t)}</text>`));
  if (min < 0) svg += `<line x1="${L}" y1="${y(0)}" x2="${R}" y2="${y(0)}" stroke="#b9c4c0" stroke-dasharray="3 3"/>`;
  const step = Math.max(1, Math.ceil(labels.length / 8));
  labels.forEach((l, i) => { if (i % step === 0 || i === labels.length - 1) svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`; });
  svg += `</g>`;
  series.forEach((s) => {
    const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (s.fill) svg += `<polyline points="${pts} ${x(s.values.length - 1)},${B} ${L},${B}" fill="${s.color}" opacity=".07"/>`;
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.width || 3}" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  return svg + '</svg>';
}
function bars(rows, opts = {}) {
  const max = Math.max(...rows.map((r) => Math.abs(r.value)), 1);
  if (!rows.length) return `<p class="muted">${opts.empty || 'No data for this period.'}</p>`;
  return `<div class="bar-list">${rows.map((r) => `<div class="bar-row"><span title="${esc(r.label)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span><div class="bar-track"><div class="bar-fill ${r.cls || opts.cls || ''}" style="width:${Math.max(2, (Math.abs(r.value) / max) * 100)}%"></div></div><b>${r.display ?? short(r.value)}</b></div>`).join('')}</div>`;
}
const PALETTE = ['#13201c', '#a3172b', '#17633f', '#8a6200', '#245b8f', '#73817c'];
function donut(segs, center) {
  const total = segs.reduce((s, x) => s + Math.max(0, x.value), 0);
  let acc = 0;
  const grad = total ? segs.map((s) => { const a = (acc / total) * 100; acc += Math.max(0, s.value); return `${s.color} ${a}% ${(acc / total) * 100}%`; }).join(',') : '#e8ecea 0 100%';
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${grad})"><div class="donut-center">${center}</div></div><div class="legend-list">${segs.map((s) => `<span><i><span class="dot" style="color:${s.color}"></span>${esc(s.label)}</i><b>${s.display ?? (total ? Math.round((s.value / total) * 100) + '%' : '0%')}</b></span>`).join('')}</div></div>`;
}
const kpi = (label, value, sub, cls = '') => `<div class="card kpi"><div class="label">${label}</div><div class="value ${cls}">${value}</div>${sub || ''}</div>`;
const tableHtml = (cols, rows, empty = 'Nothing here yet.') => rows.length
  ? `<div class="table-wrap"><table><thead><tr>${cols.map((c) => `<th class="${c.right ? 'right' : ''}">${c.label}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`
  : `<div class="empty">${empty}</div>`;

function openModal(html, wide) { $('#mbox').className = 'modal-box' + (wide ? ' wide' : ''); $('#mbox').innerHTML = `<button class="close no-print" onclick="closeModal()" aria-label="Close">×</button>` + html; $('#modal').classList.add('show'); const f = $('#mbox input:not([type=hidden]),#mbox select'); if (f) setTimeout(() => f.focus(), 30); }

const form = (root) => Object.fromEntries($$('[name]', root).map((el) => [el.name, el.type === 'checkbox' ? el.checked : el.value]));
function pickFile(accept, capture) { return new Promise((res) => { const f = $('#filePick'); f.value = ''; f.accept = accept || ''; if (capture) f.setAttribute('capture', 'environment'); else f.removeAttribute('capture'); f.onchange = () => res(f.files[0] || null); f.click(); }); }
async function openFile(id) { const b = await GET('/files/' + id, { blob: true }); window.open(URL.createObjectURL(b), '_blank'); }
function downloadXlsx(sheets, filename) {
  if (!window.XLSX) { toast('Excel export needs the internet the first time (to load the Excel library).', true); return; }
  const wb = XLSX.utils.book_new();

  XLSX.writeFile(wb, filename);
}
async function downloadServer(path, filename) {

  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);

<script>
/* ================= dashboard ================= */

    return;
  }
  const d = await GET('/insights/dashboard?' + pq());
  window._dash = d;
  const k = d.kpis;

  el.innerHTML = head + `

      <div class="chart">${lineChart([{ values: trend.map((t) => t.revenuePaise), color: '#17633f', width: 3.5 }, { values: trend.map((t) => t.netProfitPaise), color: '#a3172b', width: 2.5 }], trend.map((t) => dshort(t.date)), { title: 'Revenue and net profit by day' })}</div></div>

      <div class="bar-list">${svp.map((m) => `<div class="bar-row dual"><span>${m.label}</span><div class="dual-tracks"><div class="bar-track"><div class="bar-fill" style="width:${(m.salesPaise / maxSP) * 100}%"></div></div><div class="bar-track"><div class="bar-fill red" style="width:${(m.purchasesPaise / maxSP) * 100}%"></div></div></div><b>${short(m.salesPaise)}</b></div>`).join('')}</div></div>

    <div class="card"><div class="card-title"><h2>Cash Flow</h2><span class="${cf.netPaise >= 0 ? 'up' : 'down'}">Net ${cf.netPaise >= 0 ? '+' : ''}${inr(cf.netPaise)}</span></div>

let BILL = null;
async function partiesFor(kind) { const all = await GET('/parties'); return all.filter((p) => (kind === 'buy' ? p.type === 'supplier' : p.type !== 'supplier')); }

/** Open any bill in its entry form, with every field and line filled in, ready to change and save. */
async function editInvoice(id) {
  const inv = await GET('/invoices/' + id);
  if (inv.status === 'cancelled') return toast('Cancelled bills cannot be edited', true);
  if (inv.type.startsWith('purchase')) await purchaseModal(inv.type, null, inv); else await saleModal(inv.type, inv);
}
function fillBill(inv) {
  const set = (n, v) => { const el = $(`#bf [name=${n}]`); if (el && v != null) el.value = v; };
  set('partyId', inv.partyId || ''); set('date', inv.date); set('dueDate', inv.dueDate || ''); set('payMode', inv.payMode);
  // a bill that was paid in full stays "paid in full" when its total changes; a part payment keeps its amount
  set('paid', inv.paidPaise >= inv.totalPaise && inv.payMode !== 'credit' ? '' : rupees(inv.paidPaise)); set('number', inv.number); set('discount', inv.discountPaise ? rupees(inv.discountPaise) : '');
  BILL.lines = inv.lines.map((l) => ({ productId: l.productId, name: l.name, qty: l.qty, rate: rupees(l.ratePaise), gst: l.gstBps / 100, disc: l.discountBps / 100, batch: l.batchNo || '', expiry: l.expiry || '' }));
  BILL.notes = inv.notes;
}
function wireProductSearch() {
  const s = $('#pSearch'), box = $('#pSugg'); let res = [], t;
  const show = async () => {
    const q = s.value.trim(); if (!q) { box.hidden = true; return; }
    res = (await GET('/products?limit=8&q=' + encodeURIComponent(q))).items;
    box.innerHTML = res.map((p, i) => `<button type="button" data-i="${i}"><span><b>${esc(p.name)}</b> <span class="muted">${esc(p.sku || p.barcode || '')}</span></span><span>${inr(BILL.buy ? p.costPaise : p.pricePaise)} · ${qty(p.stock)} in stock</span></button>`).join('')
      + (BILL.buy ? `<button type="button" data-new="1"><span>+ Add “${esc(q)}” as a new product</span></button>` : (res.length ? '' : '<div class="muted" style="padding:10px">No product found. Add it in Inventory first.</div>'));
    box.hidden = false;
    $$('button', box).forEach((b) => (b.onclick = () => (b.dataset.new ? addNewLine(q) : addLine(res[+b.dataset.i]))));
  };
  s.oninput = () => { clearTimeout(t); t = setTimeout(show, 180); };
  s.onkeydown = async (e) => {
    if (e.key !== 'Enter') return; e.preventDefault();
    const q = s.value.trim(); if (!q) return;
    if (/^\d{6,14}$/.test(q)) { const r = await GET('/products/lookup/' + q, { quiet: true }).catch(() => null); if (r?.found === 'catalog') return addLine(r.product); }
    if (!res.length) await show();
    if (res[0]) addLine(res[0]); else if (BILL.buy) addNewLine(q);
  };
}
function partyType() { const o = $('#bf [name=partyId]')?.selectedOptions[0]; return o?.dataset.type; }
function rateFor(p) { return BILL.buy ? p.costPaise : partyType() === 'wholesale' && p.wholesalePaise ? p.wholesalePaise : p.pricePaise; }
function addLine(p) {
  const ex = BILL.lines.find((l) => l.productId === p.id);
  if (ex) ex.qty += 1; else BILL.lines.push({ productId: p.id, name: p.name, qty: 1, rate: rupees(rateFor(p)), gst: p.gstBps / 100, disc: 0, stock: p.stock, p });
  $('#pSearch').value = ''; $('#pSugg').hidden = true; $('#pSearch').focus(); drawLines();
}
function addNewLine(name) { BILL.lines.push({ newName: name, name, qty: 1, rate: 0, gst: (ME.shop.defaultGstBps || 0) / 100, disc: 0 }); $('#pSearch').value = ''; $('#pSugg').hidden = true; drawLines(); }
function repriceBill() { BILL.lines.forEach((l) => { if (l.p) l.rate = rupees(rateFor(l.p)); }); drawLines(); }
function lineCalc(l, incl) { const gross = l.qty * l.rate * (1 - (l.disc || 0) / 100), g = (l.gst || 0) / 100; return incl ? { taxable: gross / (1 + g), tax: gross - gross / (1 + g), total: gross } : { taxable: gross, tax: gross * g, total: gross * (1 + g) }; }
function drawLines() {
  const incl = BILL.buy ? false : ME.shop.taxInclusive;
  let taxable = 0, tax = 0, total = 0;
  BILL.lines.forEach((l) => { const c = lineCalc(l, incl); taxable += c.taxable; tax += c.tax; total += c.total; });
  total -= parseFloat($('#bf [name=discount]')?.value || 0) || 0;
  if (!BILL.buy && ME.shop.roundToRupee) total = Math.round(total);
  $('#lines').innerHTML = BILL.lines.length ? `<table class="line-table"><thead><tr><th>Product</th><th>Qty</th><th class="right">${BILL.buy ? 'Purchase Rate' : 'Rate'}</th><th>Disc %</th><th>GST %</th>${BILL.buy ? '<th>Batch</th><th>Expiry</th>' : ''}<th class="right">Amount</th><th></th></tr></thead><tbody>${BILL.lines.map((l, i) => `<tr>
    <td><b>${esc(l.name)}</b>${l.newName ? ' <span class="badge blue">new</span>' : ''}${!BILL.buy && BILL.type === 'sale' && l.stock != null && l.qty > l.stock ? `<br><span class="warn" style="font-size:11px">Only ${qty(l.stock)} in stock</span>` : ''}</td>
    <td style="width:80px"><input value="${l.qty}" oninput="BILL.lines[${i}].qty=parseFloat(this.value)||0;drawTotals()" inputmode="decimal"></td>
    <td style="width:110px"><input value="${l.rate}" oninput="BILL.lines[${i}].rate=parseFloat(this.value)||0;drawTotals()" inputmode="decimal" style="text-align:right"></td>
    <td style="width:70px"><input value="${l.disc}" oninput="BILL.lines[${i}].disc=parseFloat(this.value)||0;drawTotals()" inputmode="decimal"></td>
    <td style="width:70px"><input value="${l.gst}" oninput="BILL.lines[${i}].gst=parseFloat(this.value)||0;drawTotals()" inputmode="decimal"></td>
    ${BILL.buy ? `<td style="width:90px"><input value="${esc(l.batch || '')}" oninput="BILL.lines[${i}].batch=this.value"></td><td style="width:130px"><input type="date" value="${l.expiry || ''}" oninput="BILL.lines[${i}].expiry=this.value"></td>` : ''}
    <td class="right" id="amt${i}">${inr2(Math.round(lineCalc(l, incl).total * 100))}</td><td><button class="btn" onclick="BILL.lines.splice(${i},1);drawLines()" aria-label="Remove">×</button></td></tr>`).join('')}</tbody></table>` : '<div class="muted">No items yet. Search above to add products.</div>';
  $('#lines').insertAdjacentHTML('beforeend', `<div class="totals"><span class="muted">Taxable value</span><span class="right">${inr2(Math.round(taxable * 100))}</span><span class="muted">GST</span><span class="right">${inr2(Math.round(tax * 100))}</span><span><b>Total</b></span><span class="right grand">${inr2(Math.round(total * 100))}</span></div>`);
  $('#saveBill').textContent = `Save ${TYPE[BILL.type]} — ${inr2(Math.round(total * 100))}`;
  $('#saveBill').disabled = !BILL.lines.length;
}
function drawTotals() {
  const incl = BILL.buy ? false : ME.shop.taxInclusive;
  BILL.lines.forEach((l, i) => { const c = $('#amt' + i); if (c) c.textContent = inr2(Math.round(lineCalc(l, incl).total * 100)); });
  const keep = document.activeElement; const sel = keep && keep.selectionStart;
  const tot = $('#lines .totals'); if (tot) tot.remove();
  let taxable = 0, tax = 0, total = 0;
  BILL.lines.forEach((l) => { const c = lineCalc(l, incl); taxable += c.taxable; tax += c.tax; total += c.total; });
  total -= parseFloat($('#bf [name=discount]')?.value || 0) || 0;
  if (!BILL.buy && ME.shop.roundToRupee) total = Math.round(total);
  $('#lines').insertAdjacentHTML('beforeend', `<div class="totals"><span class="muted">Taxable value</span><span class="right">${inr2(Math.round(taxable * 100))}</span><span class="muted">GST</span><span class="right">${inr2(Math.round(tax * 100))}</span><span><b>Total</b></span><span class="right grand">${inr2(Math.round(total * 100))}</span></div>`);
  $('#saveBill').textContent = `Save ${TYPE[BILL.type]} — ${inr2(Math.round(total * 100))}`;
  if (keep && sel != null) try { keep.setSelectionRange(sel, sel); } catch {}
}
async function saveBill(allowOverLimit) {
  const f = form($('#bf'));
  const body = {
    type: BILL.type, partyId: f.partyId || undefined, date: f.date || undefined, dueDate: f.dueDate || undefined, payMode: f.payMode,
    number: f.number || undefined, discountPaise: Math.round((parseFloat(f.discount) || 0) * 100), allowOverLimit: !!allowOverLimit,
    paidPaise: f.paid === '' || f.paid == null || (BILL.buy && f.payMode !== 'credit' && !parseFloat(f.paid)) ? undefined : Math.round(parseFloat(f.paid) * 100),
    lines: BILL.lines.map((l) => ({
      ...(l.productId ? { productId: l.productId } : { newProduct: { name: l.newName } }),
      qty: l.qty, ratePaise: Math.round(l.rate * 100), discountBps: Math.round((l.disc || 0) * 100), gstBps: Math.round((l.gst || 0) * 100),
      ...(l.batch ? { batchNo: l.batch } : {}), ...(l.expiry ? { expiry: l.expiry } : {}),
    })),
  };
  if (BILL.buy && !body.partyId) return toast('Choose the supplier', true);

function refreshAfterChange() { if (current === 'settings' && window._setTab === 'data') renderDataManager($('#settings')); else if (['sales', 'purchases', 'inventory', 'dashboard', 'parties', 'expenses', 'finance'].includes(current)) go(current); loadAlerts(); }

    ${tableHtml([{ label: 'Item' }, { label: 'HSN' }, { label: 'Qty', right: 1 }, { label: 'Rate', right: 1 }, { label: 'GST', right: 1 }, { label: 'Amount', right: 1 }],
      inv.lines.map((l) => `<tr><td>${esc(l.name)}${l.batchNo ? `<br><span class="muted" style="font-size:11px">Batch ${esc(l.batchNo)}${l.expiry ? ' · exp ' + dshort(l.expiry) : ''}</span>` : ''}</td><td>${esc(l.hsn || '')}</td><td class="right">${qty(l.qty)}</td><td class="right">${inr2(l.ratePaise)}${l.discountBps ? ` −${l.discountBps / 100}%` : ''}</td><td class="right">${l.gstBps / 100}%</td><td class="right">${inr2(l.totalPaise)}</td></tr>`))}
    <div class="totals"><span class="muted">Taxable value</span><span class="right">${inr2(inv.taxablePaise)}</span><span class="muted">GST</span><span class="right">${inr2(inv.taxPaise)}</span>${inv.discountPaise ? `<span class="muted">Discount</span><span class="right">−${inr2(inv.discountPaise)}</span>` : ''}${inv.roundOffPaise ? `<span class="muted">Round off</span><span class="right">${inr2(inv.roundOffPaise)}</span>` : ''}<span><b>Total</b></span><span class="right grand">${inr2(inv.totalPaise)}</span><span class="muted">Paid (${PAY[inv.payMode]})</span><span class="right">${inr2(inv.paidPaise)}</span>${due ? `<span class="muted">Balance</span><span class="right warn">${inr2(due)}</span>` : ''}</div>

async function saveExpense() {

const REPORTS = [

RENDER.reports = async (el) => {
  const P = periodRange();
  el.innerHTML = `<div class="page-head"><div><h1>Reports Centre</h1><p>Operational, inventory, financial and tax reports for ${esc(P.label)}. Change the period at the top.</p></div><div class="actions">${isBoss() ? `<button class="btn" onclick="importModal()">Import products from Excel</button><button class="btn primary" onclick="downloadServer('/excel/export','stockbook-full-backup.xlsx')">Full Excel backup</button>` : ''}</div></div>
  <div class="grid report-grid">${REPORTS.map(([k, t, d]) => `<div class="report"><h3>${t}</h3><p>${d}</p><br><button class="btn" onclick="runReport('${k}')">Generate</button></div>`).join('')}</div>`;
};
async function runReport(key) {
  const P = periodRange(), R = rupees;
  let title = REPORTS.find((r) => r[0] === key)[1], rows = [];
  const inv = async (type) => [...(await GET(`/invoices?type=${type}&${pq()}&limit=200`)), ...(await GET(`/invoices?type=${type}_return&${pq()}&limit=200`))]
    .map((r) => ({ Date: r.date, Number: r.number, Type: TYPE[r.type], Party: r.partyName || 'Walk-in', 'Pay mode': PAY[r.payMode], Total: R(r.totalPaise), Paid: R(r.paidPaise), Due: R(Math.max(0, r.totalPaise - r.paidPaise)), 'Due date': r.dueDate || '', Status: r.status }));
  if (key === 'sales') rows = await inv('sale');
  if (key === 'purchases') rows = await inv('purchase');
  if (key === 'valuation') rows = (await GET('/products?limit=500')).items.map((p) => ({ Product: p.name, SKU: p.sku || '', Category: p.category || '', Stock: p.stock, Cost: R(p.costPaise), 'Value at cost': R(Math.max(0, p.stock) * p.costPaise), 'Value at price': R(Math.max(0, p.stock) * p.pricePaise), 'Value at MRP': R(Math.max(0, p.stock) * (p.mrpPaise || p.pricePaise)) }));
  if (key === 'ledger') rows = (await GET(`/insights/stock-ledger?${pq()}&limit=2000`)).map((m) => ({ Date: m.date, Product: m.product, Movement: m.reason, Bill: m.billNumber || '', Note: m.note || '', Batch: m.batch || '', Qty: m.qty, Balance: m.balance }));
  if (key === 'pnl') { const p = await GET('/insights/pnl?' + pq()); rows = [['Revenue (excl. GST)', p.revenuePaise], ['Cost of goods sold', -p.cogsPaise], ['Gross profit', p.grossProfitPaise], ...p.expensesByCategory.map((e) => ['Expense: ' + e.category, -e.amountPaise]), ['Other income', p.otherIncomePaise], ['Net profit', p.netProfitPaise]].map(([k, v]) => ({ Item: k, Amount: R(v) })); }
  if (key === 'cashflow') { const c = await GET('/insights/cashflow?' + pq()); rows = [{ Item: 'Opening balance', Amount: R(c.openingPaise) }, ...c.inflows.map((x) => ({ Item: '+ ' + x.label, Amount: R(x.amountPaise) })), ...c.outflows.map((x) => ({ Item: '− ' + x.label, Amount: -R(x.amountPaise) })), { Item: 'Closing balance', Amount: R(c.closingPaise) }]; }
  if (key === 'recv' || key === 'pay') rows = (await GET('/insights/aging?side=' + (key === 'recv' ? 'receivable' : 'payable'))).parties.flatMap((p) => p.bills.map((b) => ({ Party: p.name, Bill: b.number, Date: b.date, 'Due date': b.dueDate || '', 'Age (days)': b.ageDays >= 999 ? '' : b.ageDays, Outstanding: R(b.outstandingPaise), Overdue: b.overdue ? 'Yes' : '' })));
  if (key === 'gst') rows = (await GET('/reports/gst?month=' + P.to.slice(0, 7))).rows.map((r) => ({ Type: TYPE[r.type], HSN: r.hsn, 'Rate %': r.gstRate, B2B: r.b2b ? 'Yes' : 'No', Taxable: R(r.taxablePaise), CGST: R(r.cgstPaise), SGST: R(r.sgstPaise), IGST: R(r.igstPaise) }));
  if (key === 'low') rows = (await GET('/reports/low-stock')).map((p) => ({ Product: p.name, Stock: p.stock, 'Reorder level': p.reorderLevel, 'Last supplier': p.lastSupplier || '' }));
  if (key === 'expiry') rows = (await GET('/reports/expiring?days=' + (ME.shop.expiryWarnDays || 30))).map((b) => ({ Product: b.name, Batch: b.batchNo, Expiry: b.expiry, 'Days left': b.daysLeft, Qty: b.qty, 'Value at cost': R(b.valueAtCostPaise) }));
  if (key === 'dead') rows = (await GET('/insights/dead-stock?days=90')).map((p) => ({ Product: p.name, Category: p.category || '', Stock: p.stock, 'Value at cost': R(p.valuePaise), 'Last sale': p.lastSale || 'Never', 'Days idle': p.daysSinceSale }));
  window._report = { title, rows };
  const cols = rows.length ? Object.keys(rows[0]) : [];
  const fmt = (v) => (typeof v === 'number' ? v.toLocaleString('en-IN', { maximumFractionDigits: 2 }) : esc(v));
  openModal(`<h2>${title}</h2><p class="muted">${esc(P.label)} · ${rows.length} rows</p>
  ${tableHtml(cols.map((c) => ({ label: esc(c), right: typeof rows[0][c] === 'number' })), rows.slice(0, 500).map((r) => `<tr>${cols.map((c) => `<td class="${typeof r[c] === 'number' ? 'right' : ''}">${fmt(r[c])}</td>`).join('')}</tr>`), 'Nothing to report for this period.')}

}

async function runImport(commit) {

  $('#xlOut').innerHTML = `<div class="notice">${commit ? `Imported: ${r.created} new, ${r.updated} updated.` : `${pv.toCreate} new and ${pv.toUpdate} existing products found in ${pv.totalRows} rows.`}</div><p class="muted" style="font-size:12px">${Object.entries(pv.mapping).map(([h, m]) => `${esc(h)} → <b>${m || 'extra detail'}</b>`).join(' · ')}</p>`;

RENDER.settings = async (el, tab) => {
  tab = tab || window._setTab || 'shop'; window._setTab = tab;
  if (tab === 'data') return renderDataManager(el);
  await renderShopSettings(el);
  el.querySelector('.page-head').insertAdjacentHTML('afterend', settingsTabs('shop'));
};

async function saveSettings() {
  const f = form($('#setf'));
  const body = { name: f.name, phone: f.phone || null, email: f.email || null, gstin: f.gstin || null, address: f.address || null, shopType: f.shopType,
    invoicePrefix: f.invoicePrefix || null, defaultGstBps: Math.round(parseFloat(f.defaultGst) * 100), paymentTermsDays: +f.paymentTermsDays,
    taxInclusive: f.taxInclusive === '1', roundToRupee: f.roundToRupee === '1', expiryWarnDays: parseInt(f.expiryWarnDays) || 30, allowNegativeStock: f.allowNegativeStock === '1',
    costMethod: f.costMethod, extraFields: f.extraFields.split(',').map((x) => x.trim()).filter(Boolean),
    openingCashPaise: Math.round((parseFloat(f.openingCash) || 0) * 100), openingBankPaise: Math.round((parseFloat(f.openingBank) || 0) * 100), fixedAssetsPaise: Math.round((parseFloat(f.fixedAssets) || 0) * 100) };
  if (f.invoicePrefix && +f.nextInvoiceNumber) body.nextInvoiceNumber = +f.nextInvoiceNumber;
  await api('PATCH', '/auth/shop', body);
  ME = await GET('/auth/me'); $('#brandName').textContent = ME.shop.name;
  toast('Settings saved'); go('settings');
}

async function deleteParty(id) { if (!confirm('Delete this customer/supplier? Their past bills stay on record.')) return; await api('DELETE', '/parties/' + id); toast('Deleted'); refreshAfterChange(); }
async function deletePayment(id) { if (!confirm('Delete this entry? Balances and cash will be recalculated.')) return; await api('DELETE', '/payments/' + id); toast('Deleted'); refreshAfterChange(); }
async function renameCategory(from, remove) {
  const to = remove ? '' : prompt(`Rename "${from}" to:\n(Use an existing category's name to merge them.)`, from);
  if (to === null || to === from) return;
  if (remove && !confirm(`Remove the category "${from}"? Its products become uncategorised.`)) return;
  const r = await api('POST', '/products/categories/rename', { from, to: (to || '').trim() });
  toast(`${r.updated} product${r.updated === 1 ? '' : 's'} updated`); renderDataManager($('#settings'));
}
/** Add or edit any money entry: expense, payment received/made, other income, cash ↔ bank. */
async function paymentEntryModal(row, kind) {
  kind = row?.kind || kind;
  const needsParty = kind === 'payment_in' || kind === 'payment_out', isExp = kind === 'expense' || kind === 'income', transfer = kind === 'deposit' || kind === 'withdraw';

<script>
/* ================= bill scanner: OCR text parser (free, runs in the browser) ================= */
/* Stockbook bill text parser v2: OCR text → BillData. Runs in the browser (no server, no key). */
/**
 * text:       OCR of the whole bill (used for the item table and totals)
 * headerText: optional OCR of just the top of the bill, which reads large shop names more reliably
 */
function parseBillText(text, shopGstin, headerText) {
  const split = (t) => String(t || '').split(/\r?\n/).map((l) => l.replace(/[|¦]/g, ' ').replace(/[“”]/g, '"').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const lines = split(text), head = split(headerText);
  const all = lines.join('\n'), headAll = head.join('\n') + '\n' + all;
  const near = (a, b) => Math.abs(a - b) <= Math.max(0.6, Math.abs(b) * 0.012);
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const iso = (y, m, d) => { y = String(y).length === 2 ? '20' + y : String(y); if (m < 1 || m > 12 || d < 1 || d > 31) return undefined; return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; };
  const DATE_RE = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})|(\d{1,2})[\s\-\/.]*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\-\/.,']*(\d{2,4})|(\d{4})-(\d{2})-(\d{2})/i;
  const toIso = (s) => {
    const m = String(s || '').match(DATE_RE); if (!m) return undefined;
    if (m[1]) return iso(m[3], +m[2], +m[1]);
    if (m[4]) return iso(m[6], MONTHS[m[5].toLowerCase().slice(0, 3)], +m[4]);
    return iso(m[7], +m[8], +m[9]);
  };

  /* ---------- numbers as OCR writes them ---------- */
  const fixDigits = (t) => t.replace(/[©°Oo]/g, '0').replace(/[lI|]/g, '1').replace(/S(?=\d)|(?<=\d)S/g, '5').replace(/B(?=\d)|(?<=\d)B/g, '8');
  /** "2,280.00" "5:" "©" "₹1,450" "12%" → number, or null when the token is not numeric */
  const num = (tok) => {
    let t = String(tok).replace(/^(rs\.?|₹|inr)/i, '').replace(/[:;,.'"]+$/, '').replace(/^[(:;]+|[)]+$/g, '');
    if (!t) return null;
    if (/[A-Za-z©°|]/.test(t)) { const f = fixDigits(t); if (/[A-Za-z]/.test(f) || !/\d/.test(f)) return null; t = f; }
    if (!/^-?[\d,]*\.?\d+%?$/.test(t)) return null;
    t = t.replace('%', '');
    if (/^\d{1,3}(,\d{2,3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g, '');      // Indian / western thousands
    else if (/^\d+,\d{2}$/.test(t)) t = t.replace(',', '.');                   // 95,00 → 95.00
    else t = t.replace(/,/g, '');
    const n = parseFloat(t);
    return Number.isFinite(n) ? n : null;
  };
  const lastNum = (l) => { const ns = l.split(' ').map(num).filter((x) => x !== null); return ns.length ? ns[ns.length - 1] : null; };

  /* ---------- GSTIN, even when OCR splits it or confuses letters and digits ---------- */
  const toDigit = { O: '0', D: '0', Q: '0', I: '1', L: '1', S: '5', B: '8', Z: '2', G: '6', T: '7' };
  const toAlpha = { 0: 'O', 1: 'I', 5: 'S', 8: 'B', 2: 'Z', 6: 'G', 7: 'T', 4: 'A' };
  const fixGstin = (raw) => {
    const s = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s.length < 15) return null;
    const c = s.slice(0, 15).split('');
    for (const i of [0, 1, 7, 8, 9, 10]) c[i] = toDigit[c[i]] || c[i];
    for (const i of [2, 3, 4, 5, 6, 11]) c[i] = toAlpha[c[i]] || c[i];
    if (c[13] !== 'Z' && /[7Z2]/.test(c[13])) c[13] = 'Z';
    const g = c.join('');
    return /^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/.test(g) ? g : null;
  };
  const gstins = [];
  for (const m of headAll.matchAll(/gst\s*(?:in|no|number|#)?\.?\s*[:\-]?\s*([A-Z0-9][A-Z0-9 ]{14,19})/gi)) { const g = fixGstin(m[1]); if (g) gstins.push(g); }
  for (const m of headAll.matchAll(/\b[0-9OIS]{2}[A-Z0-9]{13}\b/gi)) { const g = fixGstin(m[0]); if (g) gstins.push(g); }
  const shopG = (shopGstin || '').toUpperCase();
  const vendorGstin = gstins.find((g) => g !== shopG);

  /* ---------- header fields ---------- */
  const first = (re) => { for (const l of [...head, ...lines]) { const m = l.match(re); if (m) return m; } return null; };
  const billNo = first(/(?:invoice|inv|bill|voucher|vch|receipt|memo|challan)\s*(?:no|number|#)?\s*\.?\s*[:#\-]\s*([A-Z0-9][A-Z0-9\/\-]{1,30})/i)?.[1]
    || first(/(?:invoice|inv|bill)\s*(?:no|number|#)\.?\s*([A-Z0-9][A-Z0-9\/\-]{1,30})/i)?.[1];
  const dateLine = first(/(?:invoice|bill|inv\.?|doc)?\s*dated?\b/i);
  const dueLine = first(/due\s*(?:date|on|by)?/i);
  const both = [...head, ...lines];
  const date = (dateLine && toIso(both.find((l) => l.includes(dateLine[0])).split(/dated?/i).slice(1).join(' '))) || toIso(both.find((l) => DATE_RE.test(l) && !/due/i.test(l)));
  const dueDate = dueLine ? toIso(both.find((l) => /due\s*(?:date|on|by)?/i.test(l)).split(/due/i)[1]) : undefined;
  const phone = first(/(?:phone|ph|mob(?:ile)?|tel|contact|cell)\.?\s*(?:no)?\.?\s*[:\-]?\s*(\+?\d[\d\s\-]{8,14}\d)/i)?.[1]?.trim();

  let vendorName;
  for (const l of [...head.slice(0, 6), ...lines.slice(0, 8)]) {
    const t = l.replace(/\b(tax\s+invoice|invoice|bill\s+of\s+supply|cash\s+memo|estimate|original|duplicate|triplicate|retail\s+invoice)\b.*$/i, '').replace(/^[^A-Za-z]+/, '').trim();
    if (/[A-Za-z]{3,}/.test(t) && !/gstin|phone|mob|invoice|bill\s*(no|to)|date|road|street|nagar|plot|^m\/s/i.test(t) && t.length <= 60) { vendorName = t; break; }
  }

  /* ---------- totals ---------- */
  const TOTALS = /(sub\s*-?\s*total|taxable\s*(value|amount|amt)|\bcgst\b|\bsgst\b|\bigst\b|utgst|\bcess\b|round\s*(off|ing)|grand\s*total|net\s*(amount|amt|payable|total)|total\s*(amount|amt|value|rs|qty)?\b|amount\s*(payable|due)|bill\s*amount|invoice\s*(total|value)|amount in words|rupees|e\s*&\s*o\s*e)/i;
  const findTotal = (re) => { let v = null; for (const l of lines) if (re.test(l) && !isHeader(l)) { const n = lastNum(l.replace(/@\s*[\d.]+\s*%/g, '').replace(/\d+(\.\d+)?\s*%/g, '')); if (n !== null) v = n; } return v; };

  /* ---------- the item table ---------- */
  const COLS = [
    ['desc', /^(description|particulars|item|items|product|goods|name|details)$/i],
    ['serial', /^(s\.?\s*no\.?|sr\.?|sl\.?|sno|#|no\.?)$/i],
    ['hsn', /^(hsn|sac|hsn\/sac|hsn\/sac\.?)$/i],
    ['qty', /^(qty|qty\.|quantity|qnty|nos|pcs)$/i],
    ['unit', /^(unit|uom|units)$/i],
    ['mrp', /^mrp$/i],
    ['rate', /^(rate|price|rate\/unit|unit\s*price|s\.?rate|p\.?rate)$/i],
    ['disc', /^(disc|disc%|disc\.|discount|dis%|dis)$/i],
    ['gst', /^(gst|gst%|tax%|tax|igst%|gst\s*%|rate%)$/i],
    ['taxable', /^(taxable|taxable\s*value|value|net\s*value)$/i],
    ['cgst', /^cgst$/i], ['sgst', /^(sgst|utgst)$/i], ['igst', /^igst$/i],
    ['amount', /^(amount|amt|amt\.|total|net\s*amt|net\s*amount|line\s*total|value\s*\(?rs\)?)$/i],
    ['batch', /^(batch|batch\s*no)$/i], ['expiry', /^(exp|expiry|exp\.?\s*date)$/i],
  ];
  const classify = (w) => (COLS.find(([, re]) => re.test(w)) || [null])[0];
  function headerCols(l) {
    const words = l.replace(/\(.*?\)/g, ' ').split(' ').filter(Boolean);
    const out = [];
    for (let i = 0; i < words.length; i++) {
      const two = words[i] + ' ' + (words[i + 1] || '');
      let k = classify(two);
      if (k) { i++; } else k = classify(words[i]);
      if (k && !(k === 'desc' && out.includes('desc'))) out.push(k);
    }
    return out;
  }
  function isHeader(l) { const h = headerCols(l); const strong = h.filter((k) => ['desc', 'qty', 'rate', 'amount', 'hsn', 'mrp', 'taxable'].includes(k)); return strong.length >= 2 && !/\d{3,}/.test(l.replace(/\(.*?\)/g, '')); }

  const headerIdx = lines.findIndex(isHeader);
  const cols = headerIdx >= 0 ? headerCols(lines[headerIdx]) : [];
  const NUMERIC = ['hsn', 'qty', 'mrp', 'rate', 'disc', 'gst', 'taxable', 'cgst', 'sgst', 'igst', 'amount'];
  const numCols = cols.filter((k) => NUMERIC.includes(k));
  let zoneEnd = lines.length;
  if (headerIdx >= 0) for (let i = headerIdx + 1; i < lines.length; i++) if (TOTALS.test(lines[i]) && !/^\d{1,3}[.)]?\s+[A-Za-z]/.test(lines[i])) { zoneEnd = i; break; }
  const zone = headerIdx >= 0 ? lines.slice(headerIdx + 1, zoneEnd) : lines.filter((l) => !TOTALS.test(l));

  const UNIT = /^(pcs?|pes|pc5|nos?|n0s|kg|kgs|g|gm|gms|ml|l|ltr|lt|box|bx|pkt|pkts|pack|bag|bags|dz|doz|dozen|pair|prs|set|sets|mtr|m|units?|btl|bottle|jar|tin|can|roll|rolls|ctn|case)$/i;
  const items = [], unparsed = [];
  const inclusive = /incl(\.|usive|uding)?\s*(of\s*)?(all\s*)?(gst|tax)/i.test(all);

  function decode(tokens) {
    // peel numeric columns (and a unit written next to the quantity, "20 Pcs") off the end; the rest is the name
    let i = tokens.length - 1; const seq = [];
    while (i >= 0) {
      const t = tokens[i], n = num(t);
      if (n !== null) { seq.unshift({ t, n, pct: /%/.test(t) }); i--; continue; }
      const u = t.replace(/[.:]$/, '');
      if (UNIT.test(u) && seq.length && i > 0 && num(tokens[i - 1]) !== null) { seq.unshift({ t, unit: u.toLowerCase().replace(/^pes$|^pc5$/, 'pcs') }); i--; continue; }
      break;
    }
    let start = 0;
    if (/^\d{1,3}[.)]?$/.test(tokens[0]) && i >= 1) start = 1; // serial number
    const nameToks = tokens.slice(start, i + 1);
    // more numbers than the table has numeric columns: the extra ones on the left belong to the name ("Shampoo 340 ml"),
    // along with a unit written right after them
    const count = () => seq.filter((x) => !x.unit).length;
    if (numCols.length) while (count() > numCols.length) {
      nameToks.push(seq.shift().t);
      while (seq.length && seq[0].unit) nameToks.push(seq.shift().t);
    }
    const tail = seq.filter((x) => !x.unit), unit = seq.find((x) => x.unit)?.unit;
    return { name: nameToks.join(' ').replace(/^[\-–:.,]+|[\-–:.,]+$/g, '').trim(), tail, unit };
  }

  function solve(d) {
    const r = { name: d.name, unit: d.unit, qty: null, rate: null, disc: 0, gst: null, amount: null, taxable: null, hsn: undefined, mrp: null };
    let cols2 = numCols;
    if (numCols.length >= 3 && d.tail.length === numCols.length - 1) {
      // the OCR lost one number in this row: try each column as the missing one, keep the one whose arithmetic fits
      for (let miss = 0; miss < numCols.length; miss++) {
        const c = numCols.filter((_, j) => j !== miss), get = (k) => { const j = c.indexOf(k); return j >= 0 ? d.tail[j].n : null; };
        const q = get('qty'), p = get('rate'), a = get('amount') ?? get('taxable'), dd = get('disc') || 0, g = get('gst') || 0;
        const qq = q ?? (p && a ? Math.round(a / (p * (1 - dd / 100))) : null);
        if (qq && p && a && (near(qq * p * (1 - dd / 100), a) || near(qq * p * (1 - dd / 100) * (1 + g / 100), a))) { cols2 = c; break; }
      }
    }
    if (cols2.length && d.tail.length === cols2.length) {
      cols2.forEach((k, j) => {
        const v = d.tail[j];
        if (k === 'hsn') r.hsn = v.t.replace(/\D/g, '');
        else if (k === 'qty') r.qty = v.n; else if (k === 'rate') r.rate = v.n; else if (k === 'mrp') r.mrp = v.n;
        else if (k === 'disc') r.disc = v.n; else if (k === 'gst') r.gst = v.n; else if (k === 'taxable') r.taxable = v.n;
        else if (k === 'amount') r.amount = v.n;
      });
    } else {
      // no reliable header: find qty × rate ≈ amount among the numbers
      const ns = d.tail.filter((x) => !x.pct).map((x) => x.n), pct = d.tail.find((x) => x.pct);
      if (pct) r.gst = pct.n;
      if (ns.length < 2) return null;
      r.amount = ns[ns.length - 1];
      outer: for (let j = ns.length - 2; j >= 1; j--) for (let i = j - 1; i >= 0; i--) {
        const q = ns[i], p = ns[j];
        for (const rr of [p, p / 100]) if (q > 0 && rr > 0 && q < 100000 && (near(q * rr, r.amount) || (r.gst && near(q * rr * (1 + r.gst / 100), r.amount)))) {
          r.qty = q; r.rate = rr; const h = d.tail.slice(0, i).find((x) => /^\d{4,8}$/.test(x.t)); if (h) r.hsn = h.t; break outer;
        }
      }
      if (r.qty == null && ns.length === 2 && headerIdx >= 0 && numCols.includes('qty') && !numCols.includes('rate')) { r.qty = ns[0]; }
      if (r.qty == null && ns.length === 2 && headerIdx < 0) return null;
      if (r.qty == null && ns.length === 2) { r.qty = ns[0]; }
    }
    const base = r.taxable ?? null;
    const target = base ?? r.amount;
    const fits = (q, p) => q && p && target != null && (near(q * p * (1 - (r.disc || 0) / 100), target) || near(q * p * (1 - (r.disc || 0) / 100) * (1 + (r.gst || 0) / 100), target));
    // decimal points the OCR dropped: 2250 → 22.50, 9400 → 94.00
    if (r.qty && r.rate && target != null && !fits(r.qty, r.rate) && fits(r.qty, r.rate / 100)) r.rate = r.rate / 100;
    if (r.qty && r.rate && target != null && !fits(r.qty, r.rate) && near(r.qty * r.rate * (1 - (r.disc || 0) / 100), target * 100)) r.amount = (r.amount ?? target) / 100;
    // missing pieces worked out from the others
    if (!r.qty && r.rate && target) { const q = target / (r.rate * (1 - (r.disc || 0) / 100)); if (Math.abs(q - Math.round(q)) < 0.02) r.qty = Math.round(q); }
    if (r.qty && !r.rate && target) r.rate = Math.round((target / r.qty / (1 - (r.disc || 0) / 100)) * 100) / 100;
    if (r.amount == null && base != null) r.amount = base;
    if (!r.qty || r.rate == null) return null;
    return r;
  }

  let lastWasItem = false;

    checks.push(Math.abs(t.total - d.total) <= Math.max(1.5, d.total * 0.01) ? { ok: 1, t: `Lines + GST = ${inr2(Math.round(t.total * 100))}, matching the printed total ${inr2(Math.round(d.total * 100))}` } : { t: `Lines + GST = ${inr2(Math.round(t.total * 100))} but the printed total is ${inr2(Math.round(d.total * 100))} (difference ₹${Math.abs(diff)}). Check quantities and rates.` });
  }
  if (d.taxTotal != null && d.items.length && Math.abs(t.gst - d.taxTotal) > Math.max(1.5, d.taxTotal * 0.02)) checks.push({ t: `GST from the lines is ${inr2(Math.round(t.gst * 100))} but the bill shows ${inr2(Math.round(d.taxTotal * 100))}. Check the GST % on each line.` });
  d.items.forEach((it, i) => { if (!it.name) checks.push({ t: `Line ${i + 1} has no name` }); if (it.gstRate == null && d.kind !== 'expense') checks.push({ t: `Line ${i + 1} (${it.name || 'unnamed'}) has no GST %` }); });
  if (d.vendor.gstin && !/^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/.test(d.vendor.gstin)) checks.push({ t: `GSTIN "${d.vendor.gstin}" is not in a valid format` });
  if (!d.billNo) checks.push({ t: 'Bill number is empty' });
  (d.warnings || []).filter((w) => !w.startsWith('Check:')).forEach((w) => checks.push({ t: w }));
  const newCount = d.items.filter((it) => !it.productId).length;
  if (d.kind !== 'expense' && newCount) checks.push({ info: 1, t: `${newCount} line${newCount > 1 ? 's' : ''} will create new products. Link them to existing products if they're already in your catalog.` });
  $('#scanChecks').innerHTML = `<ul class="warn-list ${checks.every((c) => c.ok) ? 'ok-list' : ''}">${checks.map((c) => `<li style="${c.ok ? 'background:#e6f2eb;border-color:#bcdcc8;color:#17633f' : c.info ? 'background:#e8f0f8;border-color:#c9dbee;color:#245b8f' : ''}">${c.ok ? '✓ ' : c.info ? 'ℹ ' : '⚠ '}${esc(c.t)}</li>`).join('')}</ul>`;
  // representational view of the bill
  const rows = d.items.map((it) => ({ label: it.name || '—', value: Math.round((it.qty || 0) * (it.rate || 0) * (1 - (it.discount || 0) / 100) * 100) })).sort((a, b) => b.value - a.value);
  const byRate = {};
  d.items.forEach((it) => { const r = it.gstRate ?? 0; const b = (it.qty || 0) * (it.rate || 0) * (1 - (it.discount || 0) / 100); byRate[r] = (byRate[r] || 0) + b; });
  const gstP = Math.round(t.gst * 100);
  $('#scanVisual').innerHTML = `<div class="card-title"><h2>Bill at a glance</h2><span class="muted">${t.inter ? 'Inter-state: IGST' : 'Same state: CGST + SGST'}</span></div>
    <div class="stat-row"><div class="mini"><span class="muted">Items</span><b>${d.items.length}</b></div><div class="mini"><span class="muted">Units</span><b>${qty(t.units)}</b></div><div class="mini"><span class="muted">Taxable</span><b>${short(Math.round(t.taxable * 100))}</b></div><div class="mini"><span class="muted">GST</span><b>${short(gstP)}</b></div><div class="mini"><span class="muted">Total</span><b>${short(Math.round(t.total * 100))}</b></div></div>
    <div class="grid two" style="margin-top:14px;grid-template-columns:1.3fr 1fr"><div><div class="muted" style="font-size:12px">Share of bill by item</div>${bars(rows)}</div>
    <div>${donut([{ label: 'Taxable value', value: Math.round(t.taxable * 100), color: '#13201c', display: short(Math.round(t.taxable * 100)) }, ...(t.inter ? [{ label: 'IGST', value: gstP, color: '#a3172b', display: short(gstP) }] : [{ label: 'CGST', value: gstP / 2, color: '#a3172b', display: short(gstP / 2) }, { label: 'SGST', value: gstP / 2, color: '#8a6200', display: short(gstP / 2) }])], short(Math.round(t.total * 100)))}
    <div class="chips">${Object.entries(byRate).map(([r, v]) => `<span class="chip">${r}% GST<b>${short(Math.round(v * 100))}</b></span>`).join('')}</div></div></div>`;
}
/** Turn an unread OCR line into an item: text is the name, numbers fill qty / rate / amount as best they can. */
function addUnparsed(i) {
  const line = SCAN.data.unparsedLines[i];
  const toks = line.split(' ').filter((t) => !/^\d{1,3}[.)]?$/.test(t) || false);
  const nums = line.match(/-?\d[\d,]*\.?\d*/g)?.map((x) => parseFloat(x.replace(/,/g, ''))).filter((x) => Number.isFinite(x)) || [];
  const name = line.replace(/^\d{1,3}[.)]?\s+/, '').replace(/(\s+[-\d,.%©:]+|\s+(pcs|nos|kg|bag|box|pkt|set|ml|g|l))+\s*$/i, '').trim() || toks.join(' ');
  const amount = nums.length ? nums[nums.length - 1] : 0;
  let qty = 1, rate = amount;
  for (let a = 0; a < nums.length - 1; a++) for (let b = a + 1; b < nums.length - 1; b++) if (nums[a] > 0 && Math.abs(nums[a] * nums[b] - amount) <= Math.max(0.6, amount * 0.012)) { qty = nums[a]; rate = nums[b]; }
  SCAN.data.items.push({ name, qty, rate, gstRate: null, discount: 0, amount });
  SCAN.data.unparsedLines.splice(i, 1);
  renderScan();
  toast('Added. Check the quantity, rate and GST % against the photo.');
}
async function rereadScan() {
  if (SCAN.data.items.length && !confirm('Read the bill again in a different mode? This replaces the extracted data on this screen.')) return;
  const box = $('#rereadStatus'); box.hidden = false;
  const prog = (m, p) => { $('#rrMsg').textContent = m; $('#rrBar').style.width = (p || 0) + '%'; };
  try {
    const blob = await (await fetch(SCAN.url)).blob();
    const o = await ocrBill(blob, true, prog);
    const parsed = parseBillText(o.text, ME.shop.gstin, o.headerText);
    const before = SCAN.data.items.length;
    await api('PUT', `/scans/${SCAN.id}/data`, { data: parsed, engine: 'ocr', rawText: o.text });
    toast(`Read again: ${parsed.items.length} items (was ${before})`);
    openScan(SCAN.id);
  } catch (e) { prog('Could not read the bill: ' + e.message, 0); }
}
async function saveScan(quiet) {
  const r = await api('PUT', `/scans/${SCAN.id}/data`, { data: SCAN.data, engine: 'manual' });
  SCAN = { ...SCAN, ...r, url: SCAN.url, file: SCAN.file };
  if (!quiet) { toast('Saved'); renderScan(); }
}
async function convertScan() {
  const f = form($('#convf')), d = SCAN.data;
  if (d.kind !== 'expense' && !d.items.length) return toast('Add at least one item line', true);
  if (!d.vendor.name && d.kind !== 'expense') return toast('Enter the vendor name', true);
  await saveScan(true);
  const body = { as: d.kind === 'expense' ? 'expense' : 'purchase', payMode: f.payMode, category: d.category || undefined, createSupplier: true };
  if (f.paid !== undefined && f.paid !== '' && f.payMode !== 'credit') body.paidPaise = Math.round(parseFloat(f.paid) * 100);
  const r = await api('POST', `/scans/${SCAN.id}/convert`, body);
  CATALOG = null;
  if (r.converted === 'purchase') {
    const diff = r.totalCheck?.differencePaise;
    toast(`Purchase ${r.invoice.number} created · ${inr2(r.invoice.totalPaise)}${diff ? ` (₹${Math.abs(diff / 100).toFixed(2)} ${diff > 0 ? 'more' : 'less'} than printed, from rounding)` : ''}`);
  } else toast('Expense recorded');
  loadAlerts(); openScan(SCAN.id);
}
function exportScan() {
  const d = SCAN.data, t = scanTotals();
  downloadXlsx({
    Bill: [{ Vendor: d.vendor.name || '', GSTIN: d.vendor.gstin || '', Phone: d.vendor.phone || '', 'Bill no.': d.billNo || '', Date: d.date || '', 'Due date': d.dueDate || '', Kind: d.kind, 'Printed total': d.total ?? '', 'Printed GST': d.taxTotal ?? '', 'Calculated taxable': +t.taxable.toFixed(2), 'Calculated GST': +t.gst.toFixed(2), 'Calculated total': +t.total.toFixed(2) }],
    Items: d.items.map((it) => ({ Item: it.name, HSN: it.hsn || '', Qty: it.qty, Rate: it.rate, 'GST %': it.gstRate ?? '', Amount: +((it.qty || 0) * (it.rate || 0)).toFixed(2), 'Linked product': CATALOG?.find((p) => p.id === it.productId)?.name || '' })),
  }, `bill-${(d.billNo || SCAN.id).replace(/\W+/g, '-')}.xlsx`);
}

/* ================= start ================= */
if (token) boot(); else showLogin();
</script>
